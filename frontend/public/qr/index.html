<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de QR Code Design avec Logo</title>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>
    <link rel="stylesheet" href="../qr/style.css">
</head>
<body>

    <div class="invitation-card">
        <h1>Mon Billet d'Invitation VIP</h1>
        <p>Scannez pour plus de détails sur l'événement !</p>
        
        <div id="qr-container">
            <div id="qr-code"></div> 
            <img id="qr-icon" src="assets/images/logo.png" alt="Logo de l'événement">
        </div>

        <p class="date">Date : 31 Décembre 2025</p>
    </div>

    <script src="../qr/script.js"></script>
</body>
</html>
